name: Bearing Fault CI

permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest


  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: |
          docker build \
            -f Dockerfile.api \
            -t bearing-api:ci .

      - name: Build MLflow image
        run: |
          docker build \
            -f Dockerfile.mlflow \
            -t bearing-mlflow:ci .


  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=ci_postgres_password
          POSTGRES_PASSWORD_URLENCODED=ci_postgres_password
          MINIO_ROOT_USER=ci_minio_admin
          MINIO_ROOT_PASSWORD=ci_minio_password_123
          GRAFANA_ADMIN_PASSWORD=ci_grafana_password
          DEPLOY_SECRETS_DIR=/tmp/bearing-ci-secrets
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: List Docker Compose services
        run: docker compose config --services


  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: compose-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=ci_postgres_password
          POSTGRES_PASSWORD_URLENCODED=ci_postgres_password
          MINIO_ROOT_USER=ci_minio_admin
          MINIO_ROOT_PASSWORD=ci_minio_password_123
          GRAFANA_ADMIN_PASSWORD=ci_grafana_password
          DEPLOY_SECRETS_DIR=/tmp/bearing-ci-secrets
          EOF

      - name: Validate CI Compose configuration
        run: |
          docker compose \
            -p bearing_ci \
            config --quiet

      - name: Start fresh application stack
        run: |
          docker compose \
            -p bearing_ci \
            up -d --build api

      - name: Show service status
        run: |
          docker compose \
            -p bearing_ci \
            ps -a

      - name: Verify PostgreSQL
        run: |
          docker compose \
          -p bearing_ci \
          exec -T postgres \
          pg_isready -U mlflow -d mlflow

      - name: Verify MinIO
        run: |
          docker compose \
          -p bearing_ci \
          exec -T minio \
          curl -f http://127.0.0.1:9000/minio/health/live

      - name: Verify one-shot initialization
        run: |
          MINIO_INIT_EXIT="$(
            docker inspect \
            -f '{{.State.ExitCode}}' \
            "$(docker compose -p bearing_ci ps -aq minio-init)"
          )"

          MODEL_BOOTSTRAP_EXIT="$(
            docker inspect \
            -f '{{.State.ExitCode}}' \
            "$(docker compose -p bearing_ci ps -aq model-bootstrap)"
          )"

          echo "minio-init exit: $MINIO_INIT_EXIT"
          echo "model-bootstrap exit: $MODEL_BOOTSTRAP_EXIT"

          test "$MINIO_INIT_EXIT" = "0"
          test "$MODEL_BOOTSTRAP_EXIT" = "0"

      - name: Verify MLflow
        run: |
          docker compose \
          -p bearing_ci \
          exec -T mlflow \
          python - <<'PYCODE'
          import urllib.request

          response = urllib.request.urlopen(
              "http://127.0.0.1:5000/health",
              timeout=5,
          )

          assert response.status == 200
          print("MLflow is healthy.")
          PYCODE

      - name: Verify fresh MLflow Champion
        run: |
          docker compose \
          -p bearing_ci \
          exec -T api \
          python - <<'PYCODE'
          import os

          import mlflow
          from mlflow import MlflowClient

          uri = os.environ["MLFLOW_TRACKING_URI"]

          mlflow.set_tracking_uri(uri)
          mlflow.set_registry_uri(uri)

          client = MlflowClient()

          champion = client.get_model_version_by_alias(
              "bearing_condition_logistic",
              "champion",
          )

          print("Model   :", champion.name)
          print("Version :", champion.version)
          print("Alias   : champion")

          assert champion.name == "bearing_condition_logistic"
          assert champion.version == "1"

          print("Fresh Champion Version 1 verified.")
          PYCODE

      - name: Verify FastAPI model loading
        run: |
          docker compose \
            -p bearing_ci \
            exec -T api \
            python - <<'PYCODE'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/health"
          attempts = 30
          delay_seconds = 2

          for attempt in range(1, attempts + 1):
              try:
                  response = urllib.request.urlopen(
                      url,
                      timeout=5,
                  )

                  data = json.loads(response.read())

                  if (
                      response.status == 200
                      and data.get("model_loaded") is True
                  ):
                      print("FastAPI is healthy.")
                      print("Model URI:", data.get("model_uri"))
                      break

                  print(
                      f"Attempt {attempt}/{attempts}: "
                      f"API responded but model is not ready yet."
                  )

              except (
                  urllib.error.URLError,
                  ConnectionError,
                  TimeoutError,
              ) as exc:
                  print(
                      f"Attempt {attempt}/{attempts}: "
                      f"API not ready yet: {exc}"
                  )

              if attempt == attempts:
                  raise RuntimeError(
                      "FastAPI did not become ready within "
                      f"{attempts * delay_seconds} seconds."
                  )

              time.sleep(delay_seconds)
          PYCODE

      - name: Run raw-signal acceptance test
        run: |
          docker compose \
            -p bearing_ci \
            run --rm --no-deps \
            -v "$PWD:/project:ro" \
            -w /project \
            -e BEARING_API_URL=http://api:8000/predict \
            -e BEARING_API_USERNAME=ci_user \
            -e BEARING_API_PASSWORD=ci_password \
            api \
            python \
            tests/test_api_acceptance_fixture.py

      - name: Verify bootstrap idempotency
        run: |
          docker compose \
          -p bearing_ci \
          run --rm \
          model-bootstrap \
          | tee /tmp/bootstrap-second-run.log

          grep -q \
          "BOOTSTRAP NOT REQUIRED" \
          /tmp/bootstrap-second-run.log

          docker compose \
          -p bearing_ci \
          exec -T api \
          python - <<'PYCODE'
          import os

          import mlflow
          from mlflow import MlflowClient

          uri = os.environ["MLFLOW_TRACKING_URI"]

          mlflow.set_tracking_uri(uri)
          mlflow.set_registry_uri(uri)

          client = MlflowClient()

          versions = client.search_model_versions(
              "name='bearing_condition_logistic'"
          )

          champion = client.get_model_version_by_alias(
              "bearing_condition_logistic",
              "champion",
          )

          print("Model versions:", len(versions))
          print("Champion version:", champion.version)

          assert len(versions) == 1
          assert champion.version == "1"

          print("Bootstrap idempotency verified.")
          PYCODE

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -p bearing_ci \
            ps -a

          docker compose \
            -p bearing_ci \
            logs --tail=200

      - name: Stop integration environment
        if: always()
        run: |
          docker compose \
            -p bearing_ci \
            down -v --remove-orphans

name: Bearing Fault CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest


  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: |
          docker build \
            -f Dockerfile.api \
            -t bearing-api:ci .

      - name: Build MLflow image
        run: |
          docker build \
            -f Dockerfile.mlflow \
            -t bearing-mlflow:ci .
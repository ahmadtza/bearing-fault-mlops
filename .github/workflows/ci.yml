name: Bearing Fault CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest


  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: |
          docker build \
            -f Dockerfile.api \
            -t bearing-api:ci .

      - name: Build MLflow image
        run: |
          docker build \
            -f Dockerfile.mlflow \
            -t bearing-mlflow:ci .
  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=ci_postgres_password
          MINIO_ROOT_USER=ci_minio_admin
          MINIO_ROOT_PASSWORD=ci_minio_password_123
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: List Docker Compose services
        run: docker compose config --services
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: compose-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=ci_postgres_password
          MINIO_ROOT_USER=ci_minio_admin
          MINIO_ROOT_PASSWORD=ci_minio_password_123
          EOF
            - name: Create external CI volumes
        run: |
          docker volume create bearing_mlflow_db
          docker volume create bearing_mlflow_artifacts

      - name: Start infrastructure services
        run: |
          docker compose up -d --build postgres minio mlflow

      - name: Show service status
        run: |
          docker compose ps

      - name: Wait for MLflow health
        run: |
          for i in {1..30}; do
            if docker compose exec -T mlflow \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" \
              2>/dev/null; then
              echo "MLflow is healthy"
              exit 0
            fi

            echo "Waiting for MLflow... ($i/30)"
            sleep 5
          done

          echo "MLflow did not become healthy"
          docker compose logs mlflow
          exit 1

      - name: Verify PostgreSQL
        run: |
          docker compose exec -T postgres \
            pg_isready -U mlflow -d mlflow

      - name: Verify MinIO
        run: |
          docker compose exec -T minio \
            curl -f http://127.0.0.1:9000/minio/health/live

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Stop integration environment
        if: always()
        run: |
          docker compose down -v
          docker volume rm bearing_mlflow_db || true
          docker volume rm bearing_mlflow_artifacts || true
services:
  grafana:
    image: grafana/grafana:12.1.1
    init: true

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - bearing_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/api/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    init: true

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bearing_prometheus_data:/prometheus

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:9090/-/ready"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    init: true

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command:
      [
        "server",
        "/data",
        "--console-address",
        ":9001"
      ]

    volumes:
      - bearing_minio_data:/data

    expose:
      - "9000"
      - "9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    init: true

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Configuring MinIO client..."

        mc alias set \
          local \
          http://minio:9000 \
          "$$MINIO_ROOT_USER" \
          "$$MINIO_ROOT_PASSWORD"

        echo "Ensuring MLflow artifact bucket exists..."

        mc mb \
          --ignore-existing \
          local/mlflow-artifacts

        echo "MinIO initialization completed successfully."

    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    init: true

    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - bearing_postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3" 
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    init: true

    environment: 
     MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/mlflow
     MLFLOW_S3_ENDPOINT_URL: http://minio:9000
     AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
     AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    command:
      - /bin/sh
      - -c
      - |
        exec mlflow server \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --artifacts-destination s3://mlflow-artifacts \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "mlflow:5000,127.0.0.1:5000,localhost:5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  model-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      mlflow:
        condition: service_healthy

    volumes:
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro

    command:
      - python
      - /app/scripts/bootstrap_mlflow.py

    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    read_only: true

    tmpfs:
      - /tmp
    cap_drop:
     - ALL
    ##- "8000:8000"
    expose:
    - "8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      model-bootstrap:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    init: true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ${DEPLOY_SECRETS_DIR}/certs:/etc/nginx/certs:ro
      - ${DEPLOY_SECRETS_DIR}/auth:/etc/nginx/auth:ro

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:

  
  bearing_postgres_data:

  bearing_minio_data:

  bearing_prometheus_data:

  bearing_grafana_data:

